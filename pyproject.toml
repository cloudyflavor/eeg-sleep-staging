[project]
name = "sleepstage"
version = "0.1.0"
description = "EEG-only 4-class sleep staging with a reproducible preprocessing and evaluation pipeline"
readme = "README.md"
requires-python = ">=3.12"

# 서버 venv가 Python 3.12.12 이므로 3.12를 기준으로 맞춘다.
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "mne>=1.8",           # EDF 읽기 + 주석(hypnogram) 파싱
    "pandas>=2.2",
    "pyarrow>=17.0",      # parquet
    "scikit-learn>=1.5",
    "pyyaml>=6.0",        # 설정 파일
    "tqdm>=4.66",
]

[project.optional-dependencies]
# 부스팅 구현체. macOS에서 xgboost/lightgbm 은 libomp 가 있어야 import 된다
# (`brew install libomp`). catboost 는 자체 런타임을 번들해서 그냥 된다.
boosting = ["catboost>=1.2"]
boosting-full = ["catboost>=1.2", "xgboost>=2.1", "lightgbm>=4.5"]

tracking = ["mlflow>=2.16"]

# 분석·그림. xlrd 는 SC-subjects.xls(피험자 나이·성별) 를 읽는 데 필요하다
# — xlrd 2.0 부터는 .xlsx 를 버리고 .xls 전용이 되어 우리 용도에 정확히 맞는다.
analysis = ["matplotlib>=3.9", "xlrd>=2.0"]

# 딥러닝 단계용. 서버 GPU 는 RTX 2080 Ti (Turing) 라 bf16 이 없고 fp16 만 된다
deep = ["torch>=2.5"]

dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[project.scripts]
sleepstage = "sleepstage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sleepstage"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
