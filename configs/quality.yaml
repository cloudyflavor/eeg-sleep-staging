# 녹음 단위 신호 품질 검사
#
# 전처리 설정과 일부러 파일을 나눴다. base.yaml 은 내용이 해시가 되어 npz 이름에
# 박히므로, 여기 값을 거기 넣으면 임계값을 만질 때마다 9.3GB 를 다시 만들게 된다.
#
# 임계값은 아직 정하는 중이다. 곡선을 보고 고르는 값이라 실험 기록이 쌓이면 바뀐다.
# 바꿔 가며 돌려보라고 파일로 빼 뒀다.

quality:
  checks: ["flat"]

  # 진폭이 이보다 작은 조각을 평탄으로 센다. 단위 µV.
  flat_uv: 20

  # 한 채널에서 평탄 조각이 이 비율을 넘으면 그 채널을 불량으로 본다.
  max_flat_frac: 0.20

  # 자른 구간에서만 잰다. 자르기 전에는 낮에 깨어 있던 절반이 섞여 비율이 희석된다.
  use_crop: true

epochs_dir: data/interim/epochs
