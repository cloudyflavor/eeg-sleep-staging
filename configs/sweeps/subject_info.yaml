name: 사람에 대해 아는 값
why: |
  녹음별 macro-F1 과 나이의 순위상관이 -0.51 이고 80세 이상이 40세 미만보다
  15%p 낮다. 나이는 실제 기기에서도 아는 값이라 특징으로 넣어도 배포 조건을
  어기지 않는다. 나이 구간마다 같은 무게를 주는 것도 함께 잰다.

fixed:
  features:
    filter: zerophase
    context: smooth
    welch_average: mean
    window_extremes: true
    spindle_events: true
  train:
    model: catboost
    drop_missing: false
    threads: 12

runs:
  - {name: 안 넣음}
  - {name: 나이,        train: {subject_info: age}}
  - {name: 나이와 성별,  train: {subject_info: "age+sex"}}
  - {name: 나이 구간 가중, train: {age_weight: true}}
