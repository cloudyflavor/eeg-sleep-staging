# 학습 설정. 실행 산출물은 runs/<모델>/<전처리>/<옵션>/<실행해시>/ 에 모인다.
train:
  # 여기 적지 않는다. 파일 이름이 특징 설정에서 계산되므로 적어 두면 낡는다.
  # 실행할 때마다 --set train.features 로 준다. 경로는 sleepstage feature-path 가 낸다.
  features: null
  splits: data/splits/subject_10fold.json
  model: histgb
  # macro-F1 이 클래스를 동등하게 보므로 학습도 그렇게 맞춘다.
  class_weight: balanced
  seed: 0
  # 부스팅은 결측을 네이티브로 받는다. 선형 baseline 비교 때만 true 로.
  drop_missing: false
  # 이름만 보고 거른다. 어느 행을 보든 결과가 같아 누수가 없다.
  # all / fpz_only / pz_only / no_distance / no_p2min / no_c7min / smoothed_only / no_extremes
  feature_subset: all
  # 값을 보고 고른다. 묶음마다 그 묶음의 학습 행만 본다.
  # none / top:200 / decorr:0.95
  feature_select: none
  # none / age / age+sex — 사람에 대해 원래 아는 값을 특징으로 넣는다
  subject_info: none
  subject_table: data/raw/edfx/physionet.org/files/sleep-edfx/1.0.0/SC-subjects.xls
  # 나이 구간마다 같은 무게가 되도록 조각별 가중치를 준다
  age_weight: false
  # 부스팅이 쓸 코어 수. 비우면 코드의 기본값을 쓴다.
  # 실험을 동시에 돌릴 때 나눠 준다. 결과는 이 값과 무관하다.
  threads: null
  # 품질 검사가 배제한 녹음을 학습과 평가에서 뺀다. 비우면 아무것도 안 뺀다.
  # sleepstage quality 가 만든 보고서를 가리킨다.
  quality_report: null
  out_dir: runs
  mlflow: true
