# 4단계 학습 설정. 실행 산출물은 runs/<실행해시>/ 에 모인다.
train:
  features: data/features/181306a1fc8f.parquet   # causal / expanding / none
  splits: data/splits/subject_10fold.json
  model: histgb
  # macro-F1 이 클래스를 동등하게 보므로 학습도 그렇게 맞춘다.
  # 커스텀 그리드(YASA 방식)는 누수 위험 + 학습 3,240회라 Phase 3 으로.
  class_weight: balanced
  seed: 0
  # 부스팅은 결측을 네이티브로 받는다. 선형 baseline 비교 때만 true 로.
  drop_missing: false
  out_dir: runs
  mlflow: true
