# 2단계 전처리 — 에포크 npz → 특징 parquet
#
# 비교 실험의 축이 전부 여기 있다. 1단계 npz 를 다시 만들지 않고
# 이 파일만 바꿔 몇 번이고 다시 돌린다.

features:
  epochs_dir: data/interim/epochs
  # 산출물은 <out_dir>/<설정해시>.parquet 이 된다. 설정과 파일이 1:1 로 묶여
  # 덮어쓸 일이 없고, 같은 설정을 다시 돌리면 건너뛴다.
  out_dir: data/features

  # none / causal / zerophase
  # 레퍼런스 셋이 셋 다 다르다 (DeepSleepNet 없음 / sleep-linear 인과 / YASA 영위상).
  # 셋 다 10분 지연 예산 안이므로 성능만 보고 고른다.
  filter: causal

  # none / expanding / posthoc
  # expanding = 누적 통계. lookahead 0 이라 실시간 가능하고, 밤이 깊어질수록 사후에 수렴.
  # posthoc = 밤 전체 통계 (YASA). 실시간 불가. 도달 가능한 상한선을 재는 용도.
  normalize: expanding

  # none / smooth / shift
  # none 은 기준선이라 반드시 재야 한다 — 시간 문맥이 얼마나 벌어주는지 알려면.
  # smooth = YASA (중심 7.5분 + 과거 2분) / shift = sleep-linear (±1, ±2 에포크)
  context: none

  # MMD · Esis. 기존 특징과 겹칠 여지가 커서 "넣는다" 가 아니라 "기여도를 잰다".
  distance_features: true

  # wake 절단을 적용할지. 1단계에서 경계만 기록해뒀다.
  # 절단은 **마지막에** 한다 — 필터·정규화는 절단 전 전체 신호에 걸어야
  # 실제 기기(착용한 순간부터 쌓는다)와 맞는다.
  crop: true
